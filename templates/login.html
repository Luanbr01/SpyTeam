<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPY TEAM</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon-spyteam.svg?v=20260920">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png?v=20260920">
<link rel="stylesheet" href="/static/css/style.css?v=20260922-multimodal1">
    <!-- SPYTEAM_DEPLOY_FIX_20260919-design1 -->
    <script src="/static/js/security.js?v=20260922-security1"></script>
</head>
<body>
<div class="auth-page">
    <div class="auth-card card">
        <a class="brand brand-official" href="/" aria-label="Ir para a página inicial"><img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team brand-logo"></a>
        <h1>Bem-vindo</h1>
        <p class="subtitle">Entre com seu usuário e senha para acessar sua área.</p>

        <form id="formLogin">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>

                <div class="password-field">
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="password-toggle"
                        type="button"
                        onclick="alternarSenhaLogin()"
                        aria-label="Mostrar senha"
                        title="Mostrar senha"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
                            <circle cx="12" cy="12" r="2.8"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
            <a class="forgot-password-link" href="/esqueci-senha">Esqueceu sua senha?</a>
        </form>

        <div id="mensagem" class="message error"></div>
        <div class="auth-info">Se você não tiver uma conta, peça para o professor criar um acesso para você.</div>
    </div>
</div>
<script>
function alternarSenhaLogin() {
    const input = document.getElementById('senha');
    const botao = document.querySelector(
        '#formLogin .password-toggle'
    );

    const vaiMostrar =
        input.type === 'password';

    input.type =
        vaiMostrar
            ? 'text'
            : 'password';

    botao.classList.toggle(
        'is-visible',
        vaiMostrar
    );

    botao.setAttribute(
        'aria-label',
        vaiMostrar
            ? 'Ocultar senha'
            : 'Mostrar senha'
    );

    botao.setAttribute(
        'title',
        vaiMostrar
            ? 'Ocultar senha'
            : 'Mostrar senha'
    );
}

const form = document.getElementById('formLogin');
const mensagem = document.getElementById('mensagem');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();

    if (/\s/.test(usuario)) {
        mensagem.textContent = 'O usuário não pode conter espaços.';
        return;
    }

    mensagem.textContent = 'Entrando...';
    try {
        const resposta = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                usuario: document.getElementById('usuario').value.trim(),
                senha: document.getElementById('senha').value
            })
        });
        const dados = await resposta.json();
        if (!resposta.ok) {
            mensagem.textContent = dados.detail || 'Usuário ou senha inválidos.';
            return;
        }
        window.location.href = dados.redirect;
    } catch (erro) {
        mensagem.textContent = 'Não foi possível conectar ao servidor.';
    }
});
</script>
</body>
</html>
