<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPY TEAM</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <div class="logo-container login-logo">
        <img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team">
    </div>
<div class="auth-page">
    <div class="auth-card card">
        <a class="brand" href="/login">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-wordmark"><strong>SPY</strong><span>TEAM</span></span>
        </a>
        <h1>Bem-vindo</h1>
        <p class="subtitle">Entre com seu usuário e senha para acessar sua área.</p>

        <form id="formLogin">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
        </form>

        <div id="mensagem" class="message error"></div>
        <div class="auth-info">Se você não tiver uma conta, peça para o professor criar um acesso para você.</div>
    </div>
</div>
<script>
const form = document.getElementById('formLogin');
const mensagem = document.getElementById('mensagem');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    mensagem.textContent = 'Entrando...';
    try {
        const resposta = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                usuario: document.getElementById('usuario').value,
                senha: document.getElementById('senha').value
            })
        });
        const dados = await resposta.json();
        if (!resposta.ok) {
            mensagem.textContent = dados.detail || 'Usuário ou senha inválidos.';
            return;
        }
        window.location.href = dados.redirect;
    } catch (erro) {
        mensagem.textContent = 'Não foi possível conectar ao servidor.';
    }
});
</script>
</body>
</html>
