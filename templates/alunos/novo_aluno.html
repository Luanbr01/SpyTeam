<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno - SPY TEAM</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<div class="page">
    <div class="topbar">
        <a class="brand" href="/home"><img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team"></a>
        <a class="btn btn-secondary" href="/home" style="text-decoration:none;">← Voltar</a>
    </div>
    <section class="panel" style="max-width:560px;margin:0 auto;">
        <h1>Cadastrar aluno</h1>
        <p class="subtitle">Crie o acesso e vincule o aluno à modalidade correta.</p>
        <form id="formAluno">
            <div class="group"><label for="nome">Nome</label><input id="nome" required></div>
            <div class="group"><label for="nivel">Nível</label>
                <select id="nivel"><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select>
            </div>
            <div class="group"><label for="modalidade">Modalidade</label>
                <select id="modalidade" required>
                    <option value="">Selecione a modalidade</option>
                    <option value="Corrida">Corrida</option>
                    <option value="Natação">Natação</option>
                    <option value="Ciclismo">Ciclismo</option>
                    <option value="Triathlon">Triathlon</option>
                </select>
            </div>
            <div class="group"><label for="usuario">Usuário de acesso</label><input id="usuario" minlength="3" required></div>
            <div class="group"><label for="senha">Senha inicial</label><input id="senha" type="password" minlength="4" required></div>
            <button class="btn btn-primary" type="submit">Cadastrar aluno</button>
        </form>
        <div id="mensagem" class="message"></div>
    </section>
</div>
<script>
document.getElementById('formAluno').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensagem = document.getElementById('mensagem');
    mensagem.textContent = 'Cadastrando...';
    try {
        const dados = {
            nome: document.getElementById('nome').value,
            nivel: document.getElementById('nivel').value,
            modalidade: document.getElementById('modalidade').value,
            usuario: document.getElementById('usuario').value,
            senha: document.getElementById('senha').value
        };
        const res = await fetch('/api/alunos', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(dados)
        });
        const retorno = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(retorno.detail || 'Erro ao cadastrar aluno.');
        mensagem.className = 'message success';
        mensagem.textContent = `Aluno cadastrado! Usuário: ${retorno.usuario}`;
        document.getElementById('formAluno').reset();
    } catch (erro) {
        mensagem.className = 'message error';
        mensagem.textContent = erro.message;
    }
});
</script>
</body>
</html>
