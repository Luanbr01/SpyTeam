    </aside><div class="app-workspace"><header class="app-topbar">
        <div class="app-topbar-copy">
            <strong>Cadastrar aluno</strong>
            <span>Crie o acesso e vincule o aluno à modalidade correta.</span>
        </div>
        <div class="app-topbar-actions">
            <span class="top-status-dot" title="Online"></span>
            <span class="top-avatar">P</span>
            <button class="top-logout" onclick="sair(event)" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M13 4h6a2 2 0 012 2v12a2 2 0 01-2 2h-6"/></svg></button>
        </div>
    </header><main class="app-content"><section class="form-page-heading"><a href="/home" class="back-link">← Voltar</a><span class="eyebrow">SPY TEAM</span><h1>Cadastrar aluno</h1><p>Crie o acesso e vincule o aluno à modalidade correta.</p></section><section class="dashboard-card form-card"><form id="formAluno" class="stack-form">
<div class="form-grid"><div class="group"><label for="nome">Nome</label><input id="nome" placeholder="Nome completo" required></div><div class="group"><label for="nivel">Nível</label><select id="nivel"><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select></div></div>
<div class="group"><label for="modalidade">Modalidade</label><select id="modalidade" required><option value="">Selecione a modalidade</option><option value="Corrida">Corrida</option><option value="Natação">Natação</option><option value="Ciclismo">Ciclismo</option><option value="Triathlon">Triathlon</option></select></div>
<div class="form-grid"><div class="group"><label for="usuario">Usuário de acesso</label><input id="usuario" placeholder="Ex.: luan" minlength="3" required></div><div class="group"><label for="senha">Senha inicial</label><input id="senha" type="password" placeholder="Mínimo 4 caracteres" minlength="4" required></div></div>
<div class="form-actions"><a class="btn btn-secondary" href="/home">Cancelar</a><button class="btn btn-primary" type="submit">Cadastrar aluno →</button></div></form><div id="mensagem" class="message"></div></section></main></div></div>
<script>async function sair(event){if(event)event.preventDefault();await fetch('/api/logout',{method:'POST'});window.location.href='/login';}</script><script>
document.getElementById('formAluno').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensagem = document.getElementById('mensagem');
    mensagem.textContent = 'Cadastrando...';
    try {
        const dados = {
            nome: document.getElementById('nome').value,
            nivel: document.getElementById('nivel').value,
            modalidade: document.getElementById('modalidade').value,
            usuario: document.getElementById('usuario').value,
            senha: document.getElementById('senha').value
        };
        const res = await fetch('/api/alunos', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(dados)
        });
        const retorno = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(retorno.detail || 'Erro ao cadastrar aluno.');
        mensagem.className = 'message success';
        mensagem.textContent = `Aluno cadastrado! Usuário: ${retorno.usuario}`;
        document.getElementById('formAluno').reset();
    } catch (erro) {
        mensagem.className = 'message error';
        mensagem.textContent = erro.message;
    }
});
</script></body></html>
