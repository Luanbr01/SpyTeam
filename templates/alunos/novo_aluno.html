<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Cadastrar Aluno - SpyTeam
    </title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family:
                'Segoe UI',
                Roboto,
                sans-serif;
        }

        body {

            background: #06140d;

            color: #fff;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .card {

            background: #0c2016;

            border: 1px solid #163827;

            border-radius: 20px;

            padding: 40px;

            max-width: 460px;

            width: 100%;

            box-shadow:
                0 10px 30px rgba(0,0,0,.5);
        }

        .back {

            color: #00ff66;

            text-decoration: none;

            font-weight: 700;

            font-size: .85rem;
        }

        h2 {

            color: #00ff66;

            margin:
                20px
                0
                25px;
        }

        .group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            color: #00ff66;

            font-size: .75rem;

            font-weight: 700;

            text-transform: uppercase;

            margin-bottom: 8px;
        }

        input,
        select {

            width: 100%;

            background: #122c1e;

            border: 1px solid #1d4630;

            color: #fff;

            padding: 12px 15px;

            border-radius: 10px;

            outline: none;
        }

        button {

            width: 100%;

            background: #00ff66;

            color: #06140d;

            border: none;

            padding: 14px;

            border-radius: 50px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 8px;
        }

        #mensagem {

            margin-top: 15px;

            text-align: center;

            color: #00ff66;

            min-height: 22px;
        }

    </style>

</head>

<body>

<div class="card">

    <a
        class="back"
        href="/home"
    >
        ← Voltar ao Menu
    </a>


    <h2>
        Cadastrar Aluno
    </h2>


    <form id="formAluno">

        <!-- NOME -->

        <div class="group">

            <label for="nome">
                Nome
            </label>

            <input
                id="nome"
                required
            >

        </div>


        <!-- NÍVEL -->

        <div class="group">

            <label for="nivel">
                Nível
            </label>

            <select id="nivel">

                <option>
                    Iniciante
                </option>

                <option>
                    Intermediário
                </option>

                <option>
                    Avançado
                </option>

            </select>

        </div>


        <!-- USUÁRIO -->

        <div class="group">

            <label for="usuario">
                Usuário de acesso
            </label>

            <input
                id="usuario"
                minlength="3"
                required
            >

        </div>


        <!-- SENHA -->

        <div class="group">

            <label for="senha">
                Senha inicial
            </label>

            <input
                id="senha"
                type="password"
                minlength="4"
                required
            >

        </div>


        <button type="submit">

            Cadastrar aluno

        </button>

    </form>


    <div id="mensagem"></div>

</div>


<script>

    // ========================================================
    // CADASTRAR ALUNO
    // ========================================================

    document
        .getElementById('formAluno')
        .addEventListener(
            'submit',
            async (e) => {

                e.preventDefault();


                const mensagem =
                    document
                    .getElementById(
                        'mensagem'
                    );


                // Dados que serão enviados
                const dados = {

                    nome:
                        document
                        .getElementById(
                            'nome'
                        )
                        .value,

                    nivel:
                        document
                        .getElementById(
                            'nivel'
                        )
                        .value,

                    usuario:
                        document
                        .getElementById(
                            'usuario'
                        )
                        .value,

                    senha:
                        document
                        .getElementById(
                            'senha'
                        )
                        .value
                };


                // Envia para API
                const res =
                    await fetch(
                        '/api/alunos',
                        {

                            method: 'POST',

                            headers: {

                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify(
                                    dados
                                )
                        }
                    );


                const retorno =
                    await res.json();


                // Cadastro realizado
                if (res.ok) {

                    mensagem.textContent =
                        `Aluno cadastrado! ` +
                        `Usuário: ${retorno.usuario}`;


                    // Limpa formulário
                    document
                        .getElementById(
                            'formAluno'
                        )
                        .reset();

                } else {

                    // Exibe erro
                    mensagem.textContent =
                        retorno.detail
                        ||
                        'Erro ao cadastrar aluno.';
                }

            }
        );

</script>

</body>

</html>
