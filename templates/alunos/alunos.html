<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Alunos - SPY TEAM</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
<style>
#detalhes { display:none; }
#detalhes h2 { color:var(--primary); }
#listaTreinos h3 { margin-bottom:8px; }
.treino-card { background:#FBFDFF; border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:12px; }
.treino-card p { color:var(--text-2); line-height:1.5; }
.feedback { margin-top:12px; padding:14px; background:var(--blue-soft); border-left:3px solid var(--accent); border-radius:8px; }
.feedback h4 { color:var(--primary); margin-bottom:6px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="brand" href="/home"><span class="brand-mark"></span><span class="brand-wordmark"><strong>SPY</strong><span>TEAM</span></span></a>
    <a href="/home" class="btn btn-secondary" style="text-decoration:none;">← Voltar</a>
  </div>
  <section class="panel">
    <h1>Meus alunos</h1>
    <p class="subtitle">Consulte alunos, treinos enviados e feedbacks.</p>
  </section>
  <div id="listaAlunos" class="alunos-grid"><p class="subtitle">Carregando alunos...</p></div>
  <section id="detalhes" class="panel">
    <h2 id="nomeAluno"></h2>
    <p id="nivelAluno" class="subtitle"></p>
    <h3>Treinos enviados</h3>
    <div id="listaTreinos"></div>
  </section>
</div>
<script>


// ==========================================================
// LISTA DE ALUNOS
// ==========================================================

let alunos = [];


// ==========================================================
// CARREGAR ALUNOS
// ==========================================================

async function carregarAlunos() {

    try {

        const resposta =
            await fetch(
                '/api/alunos'
            );


        // --------------------------------------------------
        // Verificar autenticação
        // --------------------------------------------------

        if (
            resposta.status === 401
            ||
            resposta.status === 403
        ) {

            window.location.href =
                '/login';

            return;
        }


        // --------------------------------------------------
        // Verificar erro
        // --------------------------------------------------

        if (!resposta.ok) {

            document
                .getElementById(
                    'listaAlunos'
                )
                .innerHTML =

                '<p>' +
                'Erro ao carregar os alunos.' +
                '</p>';

            return;
        }


        // --------------------------------------------------
        // Converter JSON
        // --------------------------------------------------

        alunos =
            await resposta.json();


        // --------------------------------------------------
        // Mostrar
        // --------------------------------------------------

        mostrarAlunos();

    }

    catch (erro) {

        console.error(
            erro
        );

        document
            .getElementById(
                'listaAlunos'
            )
            .innerHTML =

            '<p>' +
            'Erro de conexão com o servidor.' +
            '</p>';
    }
}


// ==========================================================
// MOSTRAR ALUNOS
// ==========================================================

function mostrarAlunos() {

    const container =
        document
        .getElementById(
            'listaAlunos'
        );


    // Nenhum aluno
    if (!alunos.length) {

        container.innerHTML =

            '<p>' +
            'Nenhum aluno cadastrado.' +
            '</p>';

        return;
    }


    // Cria os cards
    container.innerHTML =

        alunos.map(

            aluno => `

                <div class="aluno-card">

                    <h2>
                        ${escapeHtml(
                            aluno.nome
                        )}
                    </h2>

                    
                    <p>

                        <strong>
                            Nível:
                        </strong>

                        ${escapeHtml(
                            aluno.nivel
                        )}

                    </p>


                    <p>

                        <strong>
                            Modalidade:
                        </strong>

                        ${escapeHtml(
                            aluno.modalidade
                            || '-'
                        )}

                    </p>

                    <p>

                        <strong>
                            Usuário:
                        </strong>

                        ${escapeHtml(
                            aluno.usuario
                            || '-'
                        )}

                    </p>

                    <button
                        class="btn-ver"
                        onclick="
                            verAluno(
                                ${aluno.id}
                            )
                        "
                    >

                        Ver treinos e feedbacks

                    </button>

                </div>

            `

        ).join('');
}


// ==========================================================
// VER ALUNO
// ==========================================================

async function verAluno(
    alunoId
) {

    const aluno =
        alunos.find(
            a => a.id === alunoId
        );


    if (!aluno) {

        return;
    }


    // ------------------------------------------------------
    // Mostrar área de detalhes
    // ------------------------------------------------------

    document
        .getElementById(
            'detalhes'
        )
        .style.display =
            'block';


    // ------------------------------------------------------
    // Nome
    // ------------------------------------------------------

    document
        .getElementById(
            'nomeAluno'
        )
        .textContent =
            aluno.nome;


    // ------------------------------------------------------
    // Nível
    // ------------------------------------------------------

    document
        .getElementById(
            'nivelAluno'
        )
        .textContent =
            `Nível: ${aluno.nivel}`;


    // ------------------------------------------------------
    // Mensagem inicial
    // ------------------------------------------------------

    const lista =
        document
        .getElementById(
            'listaTreinos'
        );


    lista.innerHTML =
        '<p>Carregando treinos...</p>';


    // ------------------------------------------------------
    // Buscar treinos
    // ------------------------------------------------------

    const resposta =
        await fetch(

            `/api/alunos/${alunoId}/treinos`

        );


    if (!resposta.ok) {

        lista.innerHTML =
            '<p>Erro ao carregar os treinos.</p>';

        return;
    }


    const treinos =
        await resposta.json();


    // ------------------------------------------------------
    // Mostrar treinos
    // ------------------------------------------------------

    mostrarTreinos(
        treinos
    );
}


// ==========================================================
// MOSTRAR TREINOS
// ==========================================================

function mostrarTreinos(
    treinos
) {

    const lista =
        document
        .getElementById(
            'listaTreinos'
        );


    // Nenhum treino
    if (!treinos.length) {

        lista.innerHTML =
            '<p>Nenhum treino enviado.</p>';

        return;
    }


    // Cria os cards
    lista.innerHTML =

        treinos.map(

            treino => `

                <div class="treino-card">

                    <h3>

                        ${escapeHtml(
                            treino.treino
                        )}

                    </h3>


                    <p>

                        <strong>
                            Modalidade:
                        </strong>

                        ${escapeHtml(
                            treino.modalidade
                        )}

                    </p>


                    <p>

                        <strong>
                            Data:
                        </strong>

                        ${escapeHtml(
                            treino.data_planejada
                        )}

                    </p>


                    <p>

                        <strong>
                            Descrição:
                        </strong>

                        ${escapeHtml(
                            treino.descricao
                        )}

                    </p>


                    <p>

                        <strong>
                            Ritmo alvo:
                        </strong>

                        ${escapeHtml(
                            treino.ritmo_alvo
                            || '-'
                        )}

                    </p>


                    ${
                        treino.concluido

                        ?

                        `

                            <span
                                class="
                                    status
                                    concluido
                                "
                            >
                                CONCLUÍDO
                            </span>


                            <div class="feedback">

                                <h4>
                                    Feedback do aluno
                                </h4>


                                <p>

                                    <strong>
                                        Nota:
                                    </strong>

                                    ${
                                        treino
                                        .feedback_nota
                                        ?? '-'
                                    }/5

                                </p>


                                <p>

                                    <strong>
                                        Dificuldade:
                                    </strong>

                                    ${escapeHtml(
                                        treino
                                        .feedback_dificuldade
                                        || '-'
                                    )}

                                </p>


                                <p>

                                    <strong>
                                        Comentário:
                                    </strong>

                                    ${escapeHtml(
                                        treino
                                        .feedback_comentario
                                        || 'Sem comentário.'
                                    )}

                                </p>

                            </div>

                        `

                        :

                        `

                            <span
                                class="
                                    status
                                    pendente
                                "
                            >
                                PENDENTE
                            </span>

                        `
                    }

                </div>

            `

        ).join('');
}


// ==========================================================
// PROTEGER TEXTO
// ==========================================================

function escapeHtml(
    texto
) {

    return String(
        texto ?? ''
    ).replace(

        /[&<>'"]/g,

        caractere => ({

            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'

        }[caractere])

    );
}


// ==========================================================
// INICIAR
// ==========================================================

carregarAlunos();

</script>


</body>

</html>
