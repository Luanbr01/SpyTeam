<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha - SPY TEAM</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon-spyteam.svg?v=20260920">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png?v=20260920">
<link rel="stylesheet" href="/static/css/style.css?v=20260920-email1">
</head>
<body>
<div class="auth-page">
    <div class="auth-card card recovery-card">
        <a class="brand brand-official" href="/login" aria-label="SPY TEAM">
            <img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team brand-logo">
        </a>
        <span class="eyebrow">NOVA SENHA</span>
        <h1>Crie uma nova senha</h1>
        <p class="subtitle">Escolha uma nova senha para voltar a acessar sua conta.</p>

        <form id="formRedefinir">
            <div class="form-group">
                <label for="novaSenha">Nova senha</label>
                <div class="password-field">
                    <input type="password" id="novaSenha" minlength="4" autocomplete="new-password" required>
                    <button class="password-toggle" type="button" data-target="novaSenha" aria-label="Mostrar senha" title="Mostrar senha">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar nova senha</label>
                <div class="password-field">
                    <input type="password" id="confirmarSenha" minlength="4" autocomplete="new-password" required>
                    <button class="password-toggle" type="button" data-target="confirmarSenha" aria-label="Mostrar senha" title="Mostrar senha">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></svg>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary" id="btnRedefinir" type="submit">Redefinir senha</button>
        </form>

        <div id="mensagem" class="message"></div>
        <a class="auth-back-link" href="/login">← Voltar para o login</a>
    </div>
</div>
<script>
document.querySelectorAll('[data-target]').forEach(botao => {
    botao.addEventListener('click', () => {
        const input = document.getElementById(botao.dataset.target);
        const mostrar = input.type === 'password';
        input.type = mostrar ? 'text' : 'password';
        botao.classList.toggle('is-visible', mostrar);
    });
});

const token = new URLSearchParams(window.location.search).get('token') || '';
const form = document.getElementById('formRedefinir');
const mensagem = document.getElementById('mensagem');
const botao = document.getElementById('btnRedefinir');

if (!token) {
    mensagem.className = 'message error';
    mensagem.textContent = 'Link de recuperação inválido. Solicite um novo link.';
    botao.disabled = true;
}

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const novaSenha = document.getElementById('novaSenha').value;
    const confirmarSenha = document.getElementById('confirmarSenha').value;

    if (novaSenha !== confirmarSenha) {
        mensagem.className = 'message error';
        mensagem.textContent = 'A confirmação da nova senha não confere.';
        return;
    }

    mensagem.className = 'message';
    mensagem.textContent = 'Redefinindo...';
    botao.disabled = true;

    try {
        const resposta = await fetch('/api/senha/redefinir', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                token,
                nova_senha: novaSenha,
                confirmar_senha: confirmarSenha
            })
        });

        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            mensagem.className = 'message error';
            mensagem.textContent = dados.detail || 'Não foi possível redefinir a senha.';
            botao.disabled = false;
            return;
        }

        mensagem.className = 'message success';
        mensagem.textContent = 'Senha redefinida com sucesso. Redirecionando para o login...';
        setTimeout(() => { window.location.href = '/login'; }, 1400);
    } catch (erro) {
        mensagem.className = 'message error';
        mensagem.textContent = 'Não foi possível conectar ao servidor.';
        botao.disabled = false;
    }
});
</script>
</body>
</html>
