    </aside><div class="app-workspace"><header class="app-topbar">
        <div class="app-topbar-copy">
            <strong>Criar novo treino</strong>
            <span>Monte um treino base para usar no planejamento semanal.</span>
        </div>
        <div class="app-topbar-actions">
            <span class="top-status-dot" title="Online"></span>
            <span class="top-avatar">P</span>
            <button class="top-logout" onclick="sair(event)" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M13 4h6a2 2 0 012 2v12a2 2 0 01-2 2h-6"/></svg></button>
        </div>
    </header><main class="app-content"><section class="form-page-heading"><a href="/home" class="back-link">← Voltar</a><span class="eyebrow">SPY TEAM</span><h1>Criar novo treino</h1><p>Monte um treino base para usar no planejamento semanal.</p></section><section class="dashboard-card form-card"><form id="formTreinoBase" class="stack-form"><div class="form-grid"><div class="form-group"><label for="titulo">Título do treino</label><input id="titulo" placeholder="Ex.: Treino intervalado" required></div><div class="form-group"><label for="modalidade">Modalidade</label><select id="modalidade" required><option value="Corrida">Corrida</option><option value="Natação">Natação</option><option value="Ciclismo">Ciclismo</option><option value="Triathlon">Triathlon</option></select></div></div><div class="form-group"><label for="descricao">Descrição</label><textarea id="descricao" placeholder="Ex.: 10 min de aquecimento, 5x1 km em ritmo forte..." required></textarea></div><div class="form-group"><label for="ritmo_alvo">Ritmo alvo <span class="label-muted">(opcional)</span></label><input id="ritmo_alvo" placeholder="Ex.: 4:30 min/km"></div><div class="form-actions"><a class="btn btn-secondary" href="/home">Cancelar</a><button class="btn btn-primary" type="submit">Criar treino →</button></div></form><div id="mensagem" class="message"></div></section></main></div></div>
<script>async function sair(event){if(event)event.preventDefault();await fetch('/api/logout',{method:'POST'});window.location.href='/login';}</script><script>
document.getElementById('formTreinoBase').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensagem = document.getElementById('mensagem');
    try {
        const dados = {
            titulo: document.getElementById('titulo').value,
            modalidade: document.getElementById('modalidade').value,
            descricao: document.getElementById('descricao').value,
            ritmo_alvo: document.getElementById('ritmo_alvo').value || null
        };
        const res = await fetch('/api/treinos-base', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(dados)});
        const retorno = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(retorno.detail || 'Erro ao cadastrar treino base.');
        mensagem.className='message success';
        mensagem.textContent='Treino base cadastrado com sucesso!';
        document.getElementById('formTreinoBase').reset();
    } catch (erro) {
        mensagem.className='message error';
        mensagem.textContent=erro.message;
    }
});
</script></body></html>
