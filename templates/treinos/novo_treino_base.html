<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Treino Base - SPY TEAM</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="page">
    <div class="topbar">
        <a class="brand brand-official" href="/" aria-label="Ir para a página inicial"><img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team brand-logo"></a>
        <a class="btn btn-secondary" href="/home" style="text-decoration:none;">← Voltar</a>
    </div>
    <section class="panel" style="max-width:620px;margin:0 auto;">
        <h1>Cadastrar treino base</h1>
        <p class="subtitle">Crie um modelo que poderá ser usado no planejamento semanal.</p>
        <form id="formTreinoBase">
            <div class="form-group"><label for="titulo">Título do treino</label><input id="titulo" placeholder="Ex.: Tiro 10x400m" required></div>
            <div class="form-group"><label for="modalidade">Modalidade</label>
                <select id="modalidade" required>
                    <option value="Corrida">Corrida</option><option value="Natação">Natação</option>
                    <option value="Ciclismo">Ciclismo</option><option value="Triathlon">Triathlon</option>
                </select>
            </div>
            <div class="form-group"><label for="descricao">Descrição</label><textarea id="descricao" placeholder="Detalhes da execução do treino" required></textarea></div>
            <div class="form-group"><label for="ritmo_alvo">Ritmo alvo (opcional)</label><input id="ritmo_alvo" placeholder="Ex.: 4:30 min/km"></div>
            <button class="btn btn-primary" type="submit">Cadastrar treino</button>
        </form>
        <div id="mensagem" class="message"></div>
    </section>
</div>
<script>
document.getElementById('formTreinoBase').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensagem = document.getElementById('mensagem');
    try {
        const dados = {
            titulo: document.getElementById('titulo').value,
            modalidade: document.getElementById('modalidade').value,
            descricao: document.getElementById('descricao').value,
            ritmo_alvo: document.getElementById('ritmo_alvo').value || null
        };
        const res = await fetch('/api/treinos-base', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(dados)});
        const retorno = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(retorno.detail || 'Erro ao cadastrar treino base.');
        mensagem.className='message success';
        mensagem.textContent='Treino base cadastrado com sucesso!';
        document.getElementById('formTreinoBase').reset();
    } catch (erro) {
        mensagem.className='message error';
        mensagem.textContent=erro.message;
    }
});
</script>
</body>
</html>
