<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar Treino - SPY TEAM</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="brand" href="/home"><span class="brand-mark"></span><span class="brand-wordmark"><strong>SPY</strong><span>TEAM</span></span></a>
    <a class="btn btn-secondary" href="/home" style="text-decoration:none;">← Voltar</a>
  </div>
  <section class="panel" style="max-width:620px;margin:0 auto;">
    <h1>Agendar treino</h1>
    <p class="subtitle">Envie um treino específico para um aluno.</p>
    <form id="formTreino">
      <div class="form-group"><label for="aluno">Aluno</label><select id="aluno" required></select></div>
      <div class="form-group"><label for="treinoBase">Treino base</label><select id="treinoBase" required></select></div>
      <div class="form-group"><label for="data">Data planejada</label><input type="date" id="data" required></div>
      <button class="btn btn-primary" type="submit">Agendar treino</button>
    </form>
    <div id="mensagem" class="message"></div>
  </section>
</div>
<script>
function esc(text){return String(text ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function carregarSelects(){
  try{
    const resAlunos=await fetch('/api/alunos');
    if(!resAlunos.ok) throw new Error('Não foi possível carregar os alunos.');
    const alunos=await resAlunos.json();
    const selectAluno=document.getElementById('aluno');
    selectAluno.innerHTML='<option value="">Selecione um aluno...</option>';
    alunos.forEach(a=>selectAluno.innerHTML+=`<option value="${a.id}">${esc(a.nome)} (${esc(a.nivel)} • ${esc(a.modalidade || '-')})</option>`);

    const resTreinos=await fetch('/api/treinos-base');
    if(!resTreinos.ok) throw new Error('Não foi possível carregar os treinos.');
    const treinos=await resTreinos.json();
    const selectTreino=document.getElementById('treinoBase');
    selectTreino.innerHTML='<option value="">Selecione um treino...</option>';
    treinos.forEach(t=>selectTreino.innerHTML+=`<option value="${t.id}">${esc(t.titulo)} — ${esc(t.modalidade)}</option>`);
  }catch(e){
    document.getElementById('mensagem').className='message error';
    document.getElementById('mensagem').textContent=e.message;
  }
}
document.getElementById('formTreino').addEventListener('submit',async e=>{
  e.preventDefault();
  const mensagem=document.getElementById('mensagem');
  try{
    const res=await fetch('/api/treinos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      aluno_id:Number(document.getElementById('aluno').value),
      treino_base_id:Number(document.getElementById('treinoBase').value),
      data_planejada:document.getElementById('data').value
    })});
    const retorno=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(retorno.detail || `Erro HTTP ${res.status}`);
    mensagem.className='message success';
    mensagem.textContent='Treino agendado com sucesso!';
    document.getElementById('formTreino').reset();
  }catch(erro){
    mensagem.className='message error';
    mensagem.textContent=erro.message || 'Erro de comunicação com o servidor.';
  }
});
carregarSelects();
</script>
</body>
</html>
