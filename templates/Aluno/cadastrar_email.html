<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar e-mail - SPY TEAM</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon-spyteam.svg?v=20260920">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png?v=20260920">
<link rel="stylesheet" href="/static/css/style.css?v=20260920-email1">
    <script src="/static/js/security.js?v=20260922-security1"></script>
</head>
<body>
<div class="auth-page first-access-page">
    <div class="auth-card card first-access-card">
        <a class="brand brand-official" href="/" aria-label="SPY TEAM">
            <img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team brand-logo">
        </a>
        <span class="eyebrow">PRIMEIRO ACESSO</span>
        <h1>Cadastre seu e-mail</h1>
        <p class="subtitle">Este e-mail será usado para recuperar sua senha caso você a esqueça.</p>

        <form id="formEmail">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="email" placeholder="voce@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="confirmarEmail">Confirmar e-mail</label>
                <input type="email" id="confirmarEmail" autocomplete="email" placeholder="Digite o e-mail novamente" required>
            </div>

            <button class="btn btn-primary" id="btnSalvar" type="submit">Salvar e continuar</button>
        </form>

        <div id="mensagem" class="message"></div>
        <button class="auth-secondary-action" onclick="sair(event)">Sair da conta</button>
    </div>
</div>
<script>
async function sair(event) {
    if (event) event.preventDefault();
    await fetch('/api/logout', {method: 'POST'});
    window.location.href = '/login';
}

const form = document.getElementById('formEmail');
const mensagem = document.getElementById('mensagem');
const botao = document.getElementById('btnSalvar');

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = document.getElementById('email').value.trim().toLowerCase();
    const confirmar = document.getElementById('confirmarEmail').value.trim().toLowerCase();

    if (email !== confirmar) {
        mensagem.className = 'message error';
        mensagem.textContent = 'Os e-mails não conferem.';
        return;
    }

    mensagem.className = 'message';
    mensagem.textContent = 'Salvando...';
    botao.disabled = true;

    try {
        const resposta = await fetch('/api/me/email', {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email,
                confirmar_email: confirmar
            })
        });

        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            mensagem.className = 'message error';
            mensagem.textContent = dados.detail || 'Não foi possível cadastrar o e-mail.';
            botao.disabled = false;
            return;
        }

        mensagem.className = 'message success';
        mensagem.textContent = 'E-mail cadastrado. Entrando na sua área...';
        window.location.href = dados.redirect || '/aluno';
    } catch (erro) {
        mensagem.className = 'message error';
        mensagem.textContent = 'Não foi possível conectar ao servidor.';
        botao.disabled = false;
    }
});
</script>
</body>
</html>
