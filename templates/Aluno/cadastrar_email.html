<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest?v=20260923-pwa1">
    <meta name="theme-color" content="#3161CA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPY TEAM">
    <link rel="apple-touch-icon" href="/static/img/pwa-192.png?v=20260923-pwa1">

    <title>Confirmar e-mail - SPY TEAM</title>

    <link rel="icon" type="image/svg+xml" href="/static/img/favicon-spyteam.svg?v=20260920">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png?v=20260920">
    <link rel="stylesheet" href="/static/css/style.css?v=20260925-avatarfix1">
    <script src="/static/js/security.js?v=20260922-security1"></script>
</head>
<body>
<div class="auth-page first-access-page">
    <div class="auth-card card first-access-card">
        <a class="brand brand-official" href="/" aria-label="SPY TEAM">
            <img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team brand-logo">
        </a>

        <span class="eyebrow">PRIMEIRO ACESSO</span>
        <h1>Confirme seu e-mail</h1>
        <p class="subtitle">
            O e-mail será usado para recuperar sua senha e proteger sua conta.
            Enviaremos um link de confirmação antes de liberar sua área de aluno.
        </p>

        <div id="pendenciaEmail" class="email-pending-box" hidden>
            <strong>Confirmação pendente</strong>
            <span id="pendenciaEmailTexto"></span>
            <small>Abra o e-mail recebido e toque em “Confirmar e-mail”.</small>
        </div>

        <form id="formEmail">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="email" placeholder="voce@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="confirmarEmail">Confirmar e-mail</label>
                <input type="email" id="confirmarEmail" autocomplete="email" placeholder="Digite o e-mail novamente" required>
            </div>

            <button class="btn btn-primary" id="btnSalvar" type="submit">
                Enviar confirmação
            </button>
        </form>

        <div id="mensagem" class="message"></div>
        <button class="auth-secondary-action" onclick="sair(event)">Sair da conta</button>
    </div>
</div>
<script>
async function sair(event) {
    if (event) event.preventDefault();
    await fetch('/api/logout', {method: 'POST'});
    window.location.href = '/login';
}

const form = document.getElementById('formEmail');
const mensagem = document.getElementById('mensagem');
const botao = document.getElementById('btnSalvar');

async function carregarPendencia() {
    try {
        const resposta = await fetch('/api/me');
        if (!resposta.ok) return;
        const dados = await resposta.json();

        if (dados.email_pendente) {
            document.getElementById('pendenciaEmail').hidden = false;
            document.getElementById('pendenciaEmailTexto').textContent =
                `Aguardando confirmação de ${dados.email_pendente}.`;
            document.getElementById('email').value = dados.email_pendente;
            document.getElementById('confirmarEmail').value = dados.email_pendente;
            botao.textContent = 'Reenviar confirmação';
        }
    } catch (_) {}
}

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = document.getElementById('email').value.trim().toLowerCase();
    const confirmar = document.getElementById('confirmarEmail').value.trim().toLowerCase();

    if (email !== confirmar) {
        mensagem.className = 'message error';
        mensagem.textContent = 'Os e-mails não conferem.';
        return;
    }

    mensagem.className = 'message';
    mensagem.textContent = 'Enviando confirmação...';
    botao.disabled = true;

    try {
        const resposta = await fetch('/api/me/email', {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email,
                confirmar_email: confirmar
            })
        });

        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            mensagem.className = 'message error';
            mensagem.textContent = dados.detail || 'Não foi possível enviar a confirmação.';
            return;
        }

        mensagem.className = 'message success';
        mensagem.textContent = dados.mensagem || 'Confira sua caixa de entrada.';
        document.getElementById('pendenciaEmail').hidden = false;
        document.getElementById('pendenciaEmailTexto').textContent =
            `Aguardando confirmação de ${dados.email_pendente || email}.`;
        botao.textContent = 'Reenviar confirmação';
    } catch (erro) {
        mensagem.className = 'message error';
        mensagem.textContent = 'Não foi possível conectar ao servidor.';
    } finally {
        botao.disabled = false;
    }
});

carregarPendencia();
</script>
<script defer src="/static/js/pwa.js?v=20260923-pwa2"></script>
</body>
</html>
