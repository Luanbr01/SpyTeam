<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - SPY TEAM</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260919-design2">
</head>

<body class="app-body" data-aluno-page="historico">
<div class="app-shell">

    {% include "componentes/sidebar_aluno.html" %}

    <div class="app-workspace">

        <header class="app-topbar">
            <div class="app-topbar-copy">
                <strong>Histórico</strong>
                <span>Seus treinos concluídos</span>
            </div>

            <div class="app-topbar-actions">
                <span class="top-status-dot" title="Online"></span>
                <span class="top-avatar" id="topAvatar">A</span>
                <button class="top-logout" onclick="sair(event)" title="Sair" aria-label="Sair">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 17l5-5-5-5"/>
                        <path d="M15 12H3"/>
                        <path d="M13 4h6a2 2 0 012 2v12a2 2 0 01-2 2h-6"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="app-content">
            <section class="dashboard-heading">
                <div>
                    <span class="eyebrow">EVOLUÇÃO</span>
                    <h1>Histórico de treinos</h1>
                    <p>Acompanhe os treinos que você já concluiu e seus feedbacks.</p>
                </div>
            </section>

            <section class="history-summary">
                <article class="metric-card">
                    <span class="metric-icon metric-green">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M8 12l3 3 5-6"/>
                        </svg>
                    </span>
                    <div>
                        <strong id="historicoTotal">0</strong>
                        <span>Treinos concluídos</span>
                    </div>
                </article>
            </section>

            <section class="dashboard-card history-panel">
                <div class="section-heading-row">
                    <div>
                        <span class="eyebrow">CONCLUÍDOS</span>
                        <h2>Todos os treinos finalizados</h2>
                        <p>Os mais recentes aparecem primeiro.</p>
                    </div>
                </div>

                <div id="listaConcluidos" class="history-list">
                    <p class="vazio">Carregando histórico...</p>
                </div>
            </section>
        </main>
    </div>
</div>


<script>
async function sair(event) {
    if (event) event.preventDefault();
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
}
</script>
<script src="/static/js/aluno.js?v=20260919-design2"></script>
</body>
</html>
