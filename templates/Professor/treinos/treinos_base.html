        href="/static/css/style.css?v=20260925-avatarfix1"
    >
    <script src="/static/js/security.js?v=20260922-security1"></script>
    <style>
        .treinos-filtros[hidden] { display: none; }
        .treinos-filtros { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        .treinos-filtro { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border: 1px solid #cbdcf7; border-radius: 12px; background: #f4f8ff; color: #234775; font: inherit; font-weight: 600; cursor: pointer; }
        .treinos-filtro[aria-pressed="true"] { background: #3161CA; border-color: #3161CA; color: white; }
        .treinos-filtro:focus-visible { outline: 3px solid #57C0FF; outline-offset: 3px; }
        .treinos-contador { padding: 2px 7px; border-radius: 20px; background: rgba(49,97,202,.1); font-size: .85em; }
        .treinos-filtro[aria-pressed="true"] .treinos-contador { background: rgba(255,255,255,.2); }
        .treino-base-card { border: 1px solid #dce6f5; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .treino-base-cabecalho { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
        .treino-base-titulo { margin: 0 0 8px; overflow-wrap: anywhere; }
        .treino-base-modalidade { display: inline-block; background: #edf4ff; color: #3161CA; padding: 5px 10px; border-radius: 8px; font-size: .85rem; font-weight: 600; }
        .treino-base-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
        .treino-base-descricao { white-space: pre-wrap; overflow-wrap: anywhere; }
        .treinos-resumo { margin: 14px 0 0; color: #64748b; }
        @media (max-width: 640px) {
            .treinos-filtro { flex: 1 1 calc(50% - 10px); padding: 10px; }
            .treino-base-cabecalho { flex-direction: column; gap: 14px; }
            .treino-base-acoes { width: 100%; }
            .treino-base-acoes .btn { flex: 1; padding: 10px; min-height: 44px; }
            .treino-base-card { padding: 16px; }
        }
    </style>
<link rel="stylesheet" href="/static/css/gestao-professor.css?v=20261010-1">
<link rel="stylesheet" href="/static/css/professor-design.css?v=20261010-design1">
</head>

<body class="app-body professor-design">

<div class="app-shell">

    <aside class="app-sidebar professor-sidebar">

        <a
            class="sidebar-brand"
            href="/home"
            aria-label="SPY TEAM - Dashboard"
        >
            <img
                src="/static/img/logo-spy-team.svg"
                alt="SPY TEAM"
                class="sidebar-logo"
            >
        </a>

        {% include "componentes/sidebar.html" %}

        <div class="sidebar-profile">

            <span class="sidebar-avatar">
                P
            </span>

            <span>
                <strong>Professor</strong>
                <small>SPY TEAM</small>
            </span>

        </div>

    </aside>


    <div class="app-workspace">

        <header class="app-topbar">

            <div class="app-topbar-copy">

                <strong>
                    Treinos base
                </strong>

                <span>
                    Gerencie os treinos disponíveis para o planejamento.
                </span>

            </div>


            <div class="app-topbar-actions">

                <span
                    class="top-status-dot"
                    title="Online"
                ></span>

                <span class="top-avatar">
                    P
                </span>

                <button
                    class="top-logout"
                    onclick="sair(event)"
                    title="Sair"
                    aria-label="Sair"
                >
                    ↪
                </button>

            </div>

        </header>


        <main class="app-content">

            <section class="form-page-heading">

                <a
                    href="/home"
                    class="back-link"
                >
                    ← Voltar
                </a>

                <span class="eyebrow">
                    SPY TEAM
                </span>

                <h1>
                    Treinos base
                </h1>

                <p>
                    Crie, edite e gerencie os treinos utilizados
                    no planejamento dos alunos.
                </p>

            </section>


            <section class="dashboard-card">

                <div class="form-actions">

                    <a
                        class="btn btn-primary"
                        href="/novo-treino-base"
                    >
                        + Criar novo treino
                    </a>

                </div>


                <div
                    id="mensagem"
                    role="status"
                    class="message"
                ></div>


                <div class="gestao-filtros"><label for="buscaTreinos">Buscar treino<input id="buscaTreinos" type="search" placeholder="Título ou descrição" autocomplete="off"></label></div>
                <div id="filtrosTreinos" class="treinos-filtros" role="group" aria-label="Filtrar treinos por modalidade" hidden></div>
                <p id="resumoTreinos" class="treinos-resumo" role="status"></p>

                <div
                    id="listaTreinos"
                    style="margin-top: 24px;"
                >
                    Carregando treinos...
                </div>

            </section>

        </main>

    </div>

</div>


<script>

async function sair(event) {

    if (event) {
        event.preventDefault();
    }

    await fetch(
        '/api/logout',
        {
            method: 'POST'
        }
    );

    window.location.href = '/login';
}


const modalidadesTreinos = ['Corrida', 'Natação', 'Musculação'];
let todosTreinos = [];
let modalidadeSelecionada = 'Todos';

function normalizarModalidade(valor) {
    return String(valor ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
}

function filtrarTreinos(modalidade) {
    modalidadeSelecionada = modalidade;
    renderizarTreinos();
    [...document.querySelectorAll('.treinos-filtro')].find(botao => botao.getAttribute('aria-pressed') === 'true')?.focus();
}

function renderizarTreinos() {
    const filtros = document.getElementById('filtrosTreinos');
    filtros.hidden = false;
    filtros.replaceChildren();
    for (const modalidade of ['Todos', ...modalidadesTreinos]) {
        const quantidade = modalidade === 'Todos' ? todosTreinos.length : todosTreinos.filter(t => normalizarModalidade(t.modalidade) === normalizarModalidade(modalidade)).length;
        const botao = document.createElement('button');
        botao.type = 'button';
        botao.className = 'treinos-filtro';
        botao.setAttribute('aria-pressed', String(modalidadeSelecionada === modalidade));
        botao.addEventListener('click', () => filtrarTreinos(modalidade));
        botao.append(document.createTextNode(modalidade + ' '));
        const contador = document.createElement('span');
        contador.className = 'treinos-contador';
        contador.textContent = quantidade;
        botao.append(contador);
        filtros.append(botao);
    }
    const busca = normalizarModalidade(document.getElementById('buscaTreinos').value);
    const treinos = todosTreinos.filter(t => (modalidadeSelecionada === 'Todos' || normalizarModalidade(t.modalidade) === normalizarModalidade(modalidadeSelecionada)) && normalizarModalidade(`${t.titulo} ${t.descricao}`).includes(busca));
    document.getElementById('resumoTreinos').textContent = `${treinos.length} ${treinos.length === 1 ? 'treino disponível' : 'treinos disponíveis'}${modalidadeSelecionada === 'Todos' ? '' : ' em ' + modalidadeSelecionada}.`;
    const lista = document.getElementById('listaTreinos');
    if (!treinos.length) {
        lista.innerHTML = `<div class="empty-state"><strong>${todosTreinos.length ? 'Nenhum treino encontrado' : 'Monte sua biblioteca de treinos'}</strong><p>${todosTreinos.length ? 'Experimente outra busca ou escolha uma modalidade diferente.' : 'Crie seu primeiro treino para usá-lo no planejamento semanal.'}</p>${todosTreinos.length ? '' : '<a class="btn btn-primary" href="/novo-treino-base">Criar primeiro treino</a>'}</div>`;
        return;
    }
    lista.innerHTML = treinos.map(treino => `
        <article class="treino-base-card">
            <div class="treino-base-cabecalho">
                <div>
                    <h3 class="treino-base-titulo">${escapeHtml(treino.titulo)}</h3>
                    <span class="treino-base-modalidade">${escapeHtml(treino.modalidade)}</span>
                </div>
                <div class="treino-base-acoes">
                    <a class="btn btn-secondary" href="/editar-treino-base/${Number(treino.id)}">Editar</a>
                    <button type="button" class="btn btn-secondary" onclick="copiarTreino(${Number(treino.id)}, this)">Copiar</button>
                    <button type="button" class="btn btn-secondary btn-danger-soft" onclick="excluirTreino(${Number(treino.id)}, this)">Excluir</button>
                </div>
            </div>
            <p class="treino-base-descricao">${escapeHtml(treino.descricao)}</p>
            ${treino.ritmo_alvo ? `<small><strong>Ritmo alvo:</strong> ${escapeHtml(treino.ritmo_alvo)}</small>` : ''}
        </article>
    `).join('');
}

async function carregarTreinos() {
    const lista = document.getElementById('listaTreinos');
    try {
        const resposta = await fetch('/api/treinos-base');
        const treinos = await resposta.json();
        if (!resposta.ok) throw new Error(treinos.detail || 'Erro ao carregar treinos.');
        todosTreinos = treinos;
        renderizarTreinos();
    } catch (erro) {
        document.getElementById('filtrosTreinos').hidden = true;
        document.getElementById('resumoTreinos').textContent = '';
        lista.innerHTML = `<div class="message error">${escapeHtml(erro.message)}</div>`;
    }
}


const treinosEmOperacao = new Set();
async function executarAcaoTreino(id, botao, acao) {
    if (treinosEmOperacao.has(id)) return;
    if (acao === 'excluir' && !confirm('Tem certeza que deseja excluir este treino base?')) return;
    treinosEmOperacao.add(id);
    const textoOriginal = botao?.textContent;
    if (botao) { botao.disabled = true; botao.textContent = acao === 'copiar' ? 'Copiando...' : 'Excluindo...'; botao.setAttribute('aria-busy', 'true'); }
    const mensagem = document.getElementById('mensagem');
    try {
        const resposta = await fetch(acao === 'copiar' ? `/api/treinos-base/${id}/copiar` : `/api/treinos-base/${id}`, {method: acao === 'copiar' ? 'POST' : 'DELETE'});
        const retorno = await resposta.json().catch(() => ({}));
        if (!resposta.ok) throw new Error(retorno.detail || 'Não foi possível completar a ação. Tente novamente.');
        mensagem.className = 'message success';
        mensagem.textContent = retorno.mensagem || (acao === 'copiar' ? 'Treino copiado com sucesso.' : 'Treino excluído.');
        await carregarTreinos();
        mensagem.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    } catch (erro) {
        mensagem.className = 'message error';
        mensagem.textContent = erro.message;
    } finally {
        treinosEmOperacao.delete(id);
        if (botao) { botao.disabled = false; botao.textContent = textoOriginal; botao.removeAttribute('aria-busy'); }
    }
}
async function copiarTreino(id, botao) { await executarAcaoTreino(id, botao, 'copiar'); }
async function excluirTreino(id, botao) { await executarAcaoTreino(id, botao, 'excluir'); }


function escapeHtml(valor) {

    return String(valor ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}


document.getElementById('buscaTreinos').addEventListener('input', renderizarTreinos);
carregarTreinos();

</script>


<script defer src="/static/js/pwa.js?v=20260923-pwa1"></script>
</body>
</html>
