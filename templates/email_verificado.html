<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3161CA">
    <title>Confirmação de e-mail - SPY TEAM</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon-spyteam.svg?v=20260920">
    <link rel="stylesheet" href="/static/css/style.css?v=20260925-conta1">
</head>
<body>
<div class="auth-page">
    <div class="auth-card card recovery-card email-verified-card">
        <a class="brand brand-official" href="/" aria-label="SPY TEAM">
            <img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team brand-logo">
        </a>

        {% if sucesso %}
            <div class="email-result-icon success">✓</div>
            <span class="eyebrow">E-MAIL CONFIRMADO</span>
            <h1>Confirmação concluída</h1>
            <p class="subtitle">{{ mensagem }}</p>
            <a href="{{ redirect }}" class="btn btn-primary email-result-action">
                Continuar no SPY TEAM
            </a>
        {% else %}
            <div class="email-result-icon error">!</div>
            <span class="eyebrow">NÃO FOI POSSÍVEL CONFIRMAR</span>
            <h1>Link inválido ou expirado</h1>
            <p class="subtitle">{{ mensagem }}</p>
            <a href="/login" class="btn btn-primary email-result-action">
                Voltar para o login
            </a>
        {% endif %}
    </div>
</div>
</body>
</html>
