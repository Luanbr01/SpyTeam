<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Aluno - SPY TEAM</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<div class="page">
    <div class="topbar">
        <a class="brand" href="/aluno"><img src="/static/img/logo-spy-team.svg" alt="SPY TEAM" class="logo-spy-team"></a>
        <button class="btn btn-secondary" onclick="sair()">Sair</button>
    </div>

    <section class="panel">
        <h1 id="titulo">Painel do Aluno</h1>
        <p id="subtitulo" class="subtitle">Carregando seus dados...</p>
    </section>

    <div class="stats">
        <div class="stat"><strong id="total">0</strong><span>Treinos agendados</span></div>
        <div class="stat"><strong id="pendentes">0</strong><span>Treinos pendentes</span></div>
        <div class="stat"><strong id="concluidos">0</strong><span>Treinos concluídos</span></div>
    </div>

    <section class="panel">
        <h2>📅 Meus próximos treinos</h2>
        <p class="subtitle">Confira seus treinos da semana e mantenha o foco.</p>
        <div id="semana" class="semana"></div>
    </section>

    <section class="panel">
        <h2>✅ Histórico de treinos concluídos</h2>
        <div id="listaConcluidos"><p class="vazio">Carregando...</p></div>
    </section>

    <section class="panel">
        <h2>👤 Meu perfil</h2>
        <p id="perfil" class="subtitle">Carregando...</p>
    </section>
</div>

<div id="modalFeedback" class="modal-overlay" style="display:none;">
    <div class="modal">
        <button class="modal-fechar" onclick="fecharFeedback()">×</button>
        <h2>🏆 Concluir treino</h2>
        <p id="nomeTreinoFeedback">Como foi seu treino?</p>

        <label>Como você avalia o treino?</label>
        <div class="estrelas">
            <button onclick="selecionarNota(1)">★</button>
            <button onclick="selecionarNota(2)">★</button>
            <button onclick="selecionarNota(3)">★</button>
            <button onclick="selecionarNota(4)">★</button>
            <button onclick="selecionarNota(5)">★</button>
        </div>

        <label for="feedbackDificuldade">Dificuldade</label>
        <select id="feedbackDificuldade">
            <option value="Muito fácil">Muito fácil</option>
            <option value="Fácil">Fácil</option>
            <option value="Moderado" selected>Moderado</option>
            <option value="Difícil">Difícil</option>
            <option value="Muito difícil">Muito difícil</option>
        </select>

        <label for="feedbackComentario">Comentário</label>
        <textarea id="feedbackComentario" placeholder="Conte como foi seu treino..." rows="4"></textarea>

        <button class="btn-enviar-feedback" onclick="enviarFeedback()">Concluir treino</button>
    </div>
</div>
<script src="{{ url_for('static', path='js/aluno.js') }}"></script>
</body>
</html>
