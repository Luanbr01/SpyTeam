<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planejamento Semanal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #03140d;
            color: #f2f7f4;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: min(1660px, calc(100% - 48px));
            margin: 0 auto;
            padding: 24px 0 40px;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 32px;
        }

        .titulo-area h1 {
            margin: 0;
            color: #00ff70;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .titulo-area p {
            margin: 8px 0 0;
            color: #9bb5aa;
            font-size: 18px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 13px 22px;

            background: #0a2b1e;
            border: 1px solid #15563c;
            border-radius: 10px;

            color: #ffffff;
            text-decoration: none;
            font-size: 15px;

            transition: 0.2s ease;
        }

        .btn-voltar:hover {
            background: #0e3a28;
            border-color: #00d966;
        }

        /* =========================
           DATA DA SEGUNDA
        ========================= */

        .data-container {
            background: #071f15;
            border: 1px solid #15563c;
            border-radius: 18px;

            padding: 22px 28px;

            margin-bottom: 30px;
        }

        .data-container label {
            display: block;
            color: #00ff70;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        #dataSegunda {
            width: 300px;
            max-width: 100%;

            padding: 13px 15px;

            background: #0a2b1e;
            border: 1px solid #176645;
            border-radius: 10px;

            color: #ffffff;
            font-size: 15px;
            font-weight: 600;

            outline: none;
        }

        #dataSegunda:focus {
            border-color: #00e66a;
            box-shadow: 0 0 0 2px rgba(0, 255, 112, 0.12);
        }

        /* =========================
           TABELA
        ========================= */

        .tabela-container {
            background: #061c13;
            border: 1px solid #15563c;
            border-radius: 18px;

            overflow: hidden;
        }

        .tabela {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        /* Primeira coluna */
        .tabela th:first-child,
        .tabela td:first-child {
            width: 190px;
        }

        .tabela th {
            height: 88px;

            background: #08271a;

            color: #00ff70;
            font-size: 18px;
            font-weight: 700;

            border-bottom: 1px solid #15563c;

            padding: 12px;
        }

        .tabela th:not(:first-child) {
            text-align: center;
        }

        .dia {
            display: block;
            font-size: 18px;
            color: #00ff70;
        }

        .data-dia {
            display: block;
            margin-top: 7px;

            color: #8faea1;
            font-size: 13px;
            font-weight: 400;
        }

        /* =========================
           LINHAS
        ========================= */

        .tabela td {
            padding: 14px 10px;

            border-bottom: 1px solid #123c2c;
            vertical-align: middle;
        }

        .tabela tr:last-child td {
            border-bottom: none;
        }

        /* Coluna modalidade */
        .modalidade {
            padding-left: 24px !important;
        }

        .modalidade-conteudo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icone-modalidade {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .icone-modalidade svg {
            width: 30px;
            height: 30px;

            stroke: #00e879;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nome-modalidade {
            color: #f4f7f5;
            font-size: 17px;
            font-weight: 700;
        }

        /* =========================
           SELECTS
        ========================= */

        .select-treino {
            width: 100%;
            height: 43px;

            padding: 0 12px;

            background: #0a2b1e;
            border: 1px solid #176645;
            border-radius: 9px;

            color: #f4f7f5;
            font-size: 14px;
            font-weight: 600;

            outline: none;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .select-treino:hover {
            border-color: #20d879;
        }

        .select-treino:focus {
            border-color: #00f06d;
            box-shadow: 0 0 0 2px rgba(0, 255, 112, 0.12);
        }

        .select-treino option {
            background: #09251a;
            color: #ffffff;
        }

        /* =========================
           BOTÃO ENVIAR
        ========================= */

        .acoes {
            display: flex;
            justify-content: center;

            margin-top: 36px;
        }

        #btnEnviar {
            width: min(530px, 100%);

            height: 59px;

            border: none;
            border-radius: 30px;

            background: #00f56b;

            color: #001b0e;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        #btnEnviar:hover {
            background: #20ff80;
            transform: translateY(-1px);
        }

        #btnEnviar:active {
            transform: translateY(0);
        }

        #btnEnviar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           MENSAGEM
        ========================= */

        #mensagem {
            text-align: center;
            margin-top: 17px;

            min-height: 24px;

            font-size: 15px;
            font-weight: 600;
        }

        .sucesso {
            color: #00f56b;
        }

        .erro {
            color: #ff6666;
        }

        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 1100px) {

            .container {
                width: min(100% - 28px, 1000px);
            }

            .titulo-area h1 {
                font-size: 34px;
            }

            .tabela th:first-child,
            .tabela td:first-child {
                width: 150px;
            }

            .tabela th {
                font-size: 15px;
            }

            .nome-modalidade {
                font-size: 15px;
            }

            .select-treino {
                font-size: 12px;
                padding: 0 8px;
            }
        }

        /*
         * Em telas pequenas transformamos a tabela
         * em cartões para não criar rolagem horizontal.
         */

        @media (max-width: 760px) {

            .container {
                width: calc(100% - 24px);
                padding-top: 18px;
            }

            .topo {
                flex-direction: column;
            }

            .btn-voltar {
                width: 100%;
                justify-content: center;
            }

            .titulo-area h1 {
                font-size: 30px;
            }

            .titulo-area p {
                font-size: 15px;
            }

            .data-container {
                padding: 18px;
            }

            .tabela-container {
                border-radius: 14px;
                background: transparent;
                border: none;
            }

            .tabela,
            .tabela tbody,
            .tabela tr,
            .tabela td {
                display: block;
                width: 100%;
            }

            .tabela thead {
                display: none;
            }

            .tabela tr {
                margin-bottom: 18px;

                background: #061c13;

                border: 1px solid #15563c;
                border-radius: 15px;

                overflow: hidden;
            }

            .tabela td {
                border-bottom: 1px solid #123c2c;
                padding: 14px;
            }

            .tabela td:last-child {
                border-bottom: none;
            }

            .modalidade {
                background: #08271a;
                padding: 15px !important;
            }

            .modalidade-conteudo {
                justify-content: flex-start;
            }

            .tabela td[data-dia] {
                display: grid;
                grid-template-columns: 90px 1fr;
                align-items: center;
                gap: 10px;
            }

            .tabela td[data-dia]::before {
                content: attr(data-dia);

                color: #00ff70;
                font-size: 14px;
                font-weight: 700;
            }

            .select-treino {
                height: 44px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header class="topo">

        <div class="titulo-area">
            <h1>Planejamento Semanal</h1>

            <p>
                Escolha os treinos de cada modalidade para segunda a domingo.
            </p>
        </div>

        <a href="/home" class="btn-voltar">
            ← Voltar ao Menu
        </a>

    </header>


    <!-- =========================
         DATA
    ========================== -->

    <section class="data-container">

        <label for="dataSegunda">
            Segunda-feira da semana
        </label>

        <input type="date" id="dataSegunda" onchange="corrigirParaSegunda()">

    </section>


    <!-- =========================
         TABELA
    ========================== -->

    <section class="tabela-container">

        <table class="tabela">

            <thead>

                <tr>

                    <th>
                        Modalidade
                    </th>

                    <th>
                        <span class="dia">Segunda</span>
                        <span class="data-dia" id="data-0">-</span>
                    </th>

                    <th>
                        <span class="dia">Terça</span>
                        <span class="data-dia" id="data-1">-</span>
                    </th>

                    <th>
                        <span class="dia">Quarta</span>
                        <span class="data-dia" id="data-2">-</span>
                    </th>

                    <th>
                        <span class="dia">Quinta</span>
                        <span class="data-dia" id="data-3">-</span>
                    </th>

                    <th>
                        <span class="dia">Sexta</span>
                        <span class="data-dia" id="data-4">-</span>
                    </th>

                    <th>
                        <span class="dia">Sábado</span>
                        <span class="data-dia" id="data-5">-</span>
                    </th>

                    <th>
                        <span class="dia">Domingo</span>
                        <span class="data-dia" id="data-6">-</span>
                    </th>

                </tr>

            </thead>

            <tbody id="corpoTabela">
                <!-- preenchido pelo JavaScript -->
            </tbody>

        </table>

    </section>


    <!-- =========================
         BOTÃO
    ========================== -->

    <div class="acoes">

        <button id="btnEnviar" onclick="enviarPlanejamento()">
            Enviar planejamento semanal
        </button>

    </div>


    <div id="mensagem"></div>

</div>


<script>

    /* =====================================================
       CONFIGURAÇÃO
    ===================================================== */

    const modalidades = [
        "Corrida",
        "Natação",
        "Ciclismo",
        "Triathlon"
    ];

    const dias = [
        "Segunda",
        "Terça",
        "Quarta",
        "Quinta",
        "Sexta",
        "Sábado",
        "Domingo"
    ];

    let treinosBase = [];


    /* =====================================================
       ÍCONES
       SVG simples para não poluir a interface
    ===================================================== */

    function obterIcone(modalidade) {

        if (modalidade === "Corrida") {

            return `
                <svg viewBox="0 0 32 32">
                    <circle cx="20" cy="5" r="2.5"></circle>
                    <path d="M16 11l4 3 3-3"></path>
                    <path d="M16 11l-3 6 4 2"></path>
                    <path d="M17 19l-5 7"></path>
                    <path d="M17 19l7 6"></path>
                    <path d="M13 17l-7 1"></path>
                </svg>
            `;

        }

        if (modalidade === "Natação") {

            return `
                <svg viewBox="0 0 32 32">
                    <circle cx="22" cy="7" r="2.5"></circle>
                    <path d="M18 11l-5 5 5 2 5-4"></path>
                    <path d="M13 16l-7 2"></path>
                    <path d="M5 23c3-2 6 2 9 0s6 2 9 0 4 1 5 0"></path>
                    <path d="M5 27c3-2 6 2 9 0s6 2 9 0 4 1 5 0"></path>
                </svg>
            `;

        }

        if (modalidade === "Ciclismo") {

            return `
                <svg viewBox="0 0 32 32">
                    <circle cx="8" cy="23" r="5"></circle>
                    <circle cx="24" cy="23" r="5"></circle>
                    <path d="M8 23l6-10 5 10"></path>
                    <path d="M14 13h5l5 10"></path>
                    <path d="M14 13l-3-3"></path>
                </svg>
            `;

        }

        /* Triathlon */

        return `
            <svg viewBox="0 0 32 32">
                <circle cx="23" cy="5" r="2"></circle>
                <path d="M20 10l-5 5 4 4"></path>
                <path d="M19 19l-4 7"></path>
                <path d="M19 19l7 5"></path>
                <circle cx="7" cy="23" r="4"></circle>
                <circle cx="17" cy="23" r="4"></circle>
                <path d="M7 23l6-7 4 7"></path>
                <path d="M13 16h5"></path>
            </svg>
        `;
    }


    /* =====================================================
       CRIA LINHAS DA TABELA
    ===================================================== */

    function montarTabela() {

        const corpo = document.getElementById("corpoTabela");

        corpo.innerHTML = "";

        modalidades.forEach((modalidade) => {

            const tr = document.createElement("tr");

            /* -------------------------
               Modalidade
            ------------------------- */

            const tdModalidade = document.createElement("td");

            tdModalidade.className = "modalidade";

            tdModalidade.innerHTML = `
                <div class="modalidade-conteudo">

                    <div class="icone-modalidade">
                        ${obterIcone(modalidade)}
                    </div>

                    <div class="nome-modalidade">
                        ${modalidade}
                    </div>

                </div>
            `;

            tr.appendChild(tdModalidade);


            /* -------------------------
               Segunda a Domingo
            ------------------------- */

            for (let dia = 0; dia <= 6; dia++) {

                const td = document.createElement("td");

                td.setAttribute("data-dia", dias[dia]);

                const select = document.createElement("select");

                select.className = "select-treino";

                /*
                 * IDs importantes:
                 *
                 * modalidade-dia
                 *
                 * Exemplo:
                 * corrida-0
                 * corrida-1
                 * natacao-0
                 */

                const idModalidade = modalidade
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/\s+/g, "-");

                select.id = `${idModalidade}-${dia}`;

                /* Nenhum treino */

                const opcaoVazia = document.createElement("option");

                opcaoVazia.value = "";

                opcaoVazia.textContent = "Nenhum treino";

                select.appendChild(opcaoVazia);


                /* Treinos da modalidade */

                const treinosDaModalidade = treinosBase.filter(
                    treino =>
                        treino.modalidade &&
                        treino.modalidade.toLowerCase() ===
                        modalidade.toLowerCase()
                );


                treinosDaModalidade.forEach((treino) => {

                    const option = document.createElement("option");

                    option.value = treino.id;

                    option.textContent = treino.titulo;

                    select.appendChild(option);

                });


                td.appendChild(select);

                tr.appendChild(td);
            }

            corpo.appendChild(tr);

        });
    }


    /* =====================================================
       CARREGA TREINOS DO BANCO
    ===================================================== */

    async function carregarTreinos() {

        try {

            const resposta = await fetch("/api/treinos-base");

            if (!resposta.ok) {

                if (
                    resposta.status === 401 ||
                    resposta.status === 403
                ) {

                    window.location.href = "/login";

                    return;
                }

                throw new Error(
                    "Não foi possível carregar os treinos."
                );
            }


            treinosBase = await resposta.json();

            montarTabela();

        } catch (erro) {

            console.error(erro);

            mostrarMensagem(
                "Erro ao carregar os treinos base.",
                true
            );
        }
    }


    /* =====================================================
       DATA
    ===================================================== */

    function atualizarDatas() {

        const input = document.getElementById("dataSegunda");

        if (!input.value) {

            for (let i = 0; i <= 6; i++) {

                document.getElementById(`data-${i}`)
                    .textContent = "-";
            }

            return;
        }


        const partes = input.value.split("-");

        const ano = Number(partes[0]);
        const mes = Number(partes[1]) - 1;
        const dia = Number(partes[2]);

        const segunda = new Date(
            ano,
            mes,
            dia
        );


        for (let i = 0; i <= 6; i++) {

            const data = new Date(segunda);

            data.setDate(
                segunda.getDate() + i
            );

            const diaFormatado = String(
                data.getDate()
            ).padStart(2, "0");

            const mesFormatado = String(
                data.getMonth() + 1
            ).padStart(2, "0");


            document.getElementById(`data-${i}`)
                .textContent =
                `${diaFormatado}/${mesFormatado}`;
        }
    }


    document
        .getElementById("dataSegunda")
        .addEventListener(
            "change",
            atualizarDatas
        );


    /* =====================================================
       CONFERE SE É SEGUNDA-FEIRA
    ===================================================== */

    function verificarSegundaFeira(valor) {

        if (!valor) {
            return false;
        }

        const partes = valor.split("-");

        const data = new Date(
            Number(partes[0]),
            Number(partes[1]) - 1,
            Number(partes[2])
        );

        return data.getDay() === 1;
    }


    /* =====================================================
       ENVIA PLANEJAMENTO
    ===================================================== */

    async function enviarPlanejamento() {

        const mensagem =
            document.getElementById("mensagem");

        const botao =
            document.getElementById("btnEnviar");

        mensagem.textContent = "";
        mensagem.className = "";


        const dataSegunda =
            document.getElementById("dataSegunda").value;


        /* -------------------------
           Confere data
        ------------------------- */

        if (!dataSegunda) {

            mostrarMensagem(
                "Selecione a segunda-feira da semana.",
                true
            );

            return;
        }


        if (!verificarSegundaFeira(dataSegunda)) {

            mostrarMensagem(
                "A data selecionada precisa ser uma segunda-feira.",
                true
            );

            return;
        }


        /* -------------------------
           Monta dados
        ------------------------- */

        const dados = [];

        for (let dia = 0; dia <= 6; dia++) {

            modalidades.forEach((modalidade) => {

                const idModalidade = modalidade
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/\s+/g, "-");

                const select =
                    document.getElementById(
                        `${idModalidade}-${dia}`
                    );


                if (
                    select &&
                    select.value
                ) {

                    dados.push({

                        dia: dia,

                        treino_base_id:
                            Number(select.value)

                    });

                }

            });

        }


        /* -------------------------
           Nenhum treino
        ------------------------- */

        if (dados.length === 0) {

            mostrarMensagem(
                "Selecione pelo menos um treino.",
                true
            );

            return;
        }


        /* -------------------------
           Envio
        ------------------------- */

        try {

            botao.disabled = true;

            botao.textContent =
                "Enviando...";


            const resposta = await fetch(
                `/api/treinos/semana?data_segunda=${encodeURIComponent(dataSegunda)}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(dados)
                }
            );


            const texto =
                await resposta.text();

            let resultado;

            try {

                resultado =
                    JSON.parse(texto);

            } catch {

                throw new Error(
                    texto ||
                    "Resposta inválida do servidor."
                );
            }


            if (!resposta.ok) {

                throw new Error(
                    resultado.detail ||
                    resultado.mensagem ||
                    "Erro ao enviar planejamento."
                );
            }


            mostrarMensagem(
                resultado.mensagem ||
                `Planejamento enviado com sucesso. ${resultado.total_enviados || 0} treinos enviados.`,
                false
            );


        } catch (erro) {

            console.error(erro);

            mostrarMensagem(
                erro.message ||
                "Erro ao enviar planejamento.",
                true
            );

        } finally {

            botao.disabled = false;

            botao.textContent =
                "Enviar planejamento semanal";
        }
    }


    /* =====================================================
       MENSAGEM
    ===================================================== */

    function mostrarMensagem(texto, erro = false) {

        const elemento =
            document.getElementById("mensagem");

        elemento.textContent = texto;

        elemento.className =
            erro ? "erro" : "sucesso";
    }

    

    function corrigirParaSegunda() {
        const input = document.getElementById("dataSegunda");

        if (!input.value) {
            return;
        }

        // Divide a data manualmente para evitar problemas de fuso horário
        const partes = input.value.split("-");

        const ano = parseInt(partes[0]);
        const mes = parseInt(partes[1]) - 1;
        const dia = parseInt(partes[2]);

        const data = new Date(ano, mes, dia);

        // JavaScript:
        // 0 = domingo
        // 1 = segunda
        // 2 = terça
        // ...
        // 6 = sábado
        const diaSemana = data.getDay();

        // Quantos dias precisamos voltar até segunda-feira
        const diasParaSegunda = diaSemana === 0
            ? 6
            : diaSemana - 1;

        data.setDate(data.getDate() - diasParaSegunda);

        const anoCorrigido = data.getFullYear();
        const mesCorrigido = String(data.getMonth() + 1).padStart(2, "0");
        const diaCorrigido = String(data.getDate()).padStart(2, "0");

        const novaData =
            `${anoCorrigido}-${mesCorrigido}-${diaCorrigido}`;

        // Se o usuário escolheu outro dia, corrige automaticamente
        if (input.value !== novaData) {
            input.value = novaData;

            mostrarMensagem(
                "A data foi ajustada para a segunda-feira da semana selecionada.",
                "info"
            );
        }
    }
    function definirSegundaAtual() {
        const input = document.getElementById("dataSegunda");

        if (input.value) {
            return;
        }

        const hoje = new Date();

        const diaSemana = hoje.getDay();

        const diasParaSegunda = diaSemana === 0
            ? 6
            : diaSemana - 1;

        hoje.setDate(hoje.getDate() - diasParaSegunda);

        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, "0");
        const dia = String(hoje.getDate()).padStart(2, "0");

        input.value = `${ano}-${mes}-${dia}`;
    }



    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            carregarTreinos();

            atualizarDatas();

            definirSegundaAtual();

    
    
    
        }
    );

    

</script>

</body>
</html>
