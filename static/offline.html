<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3161CA">
    <title>Sem conexão - SPY TEAM</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F5F8FF; color: #101828; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(440px, 100%); background: white; border: 1px solid #D9E2F2; border-radius: 24px; padding: 32px; box-shadow: 0 20px 50px rgba(8,21,47,.10); text-align: center; }
        img { width: 170px; max-width: 65%; margin-bottom: 18px; }
        h1 { margin: 0 0 10px; font-size: 1.55rem; }
        p { color: #667085; line-height: 1.55; margin: 0 0 22px; }
        button { border: 0; border-radius: 12px; padding: 12px 18px; color: white; background: #3161CA; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="/static/img/logo-spy-team.svg" alt="SPY TEAM">
    <h1>Você está sem conexão</h1>
    <p>Conecte-se à internet para carregar seus dados e sincronizar os treinos.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
