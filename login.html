<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Login - SpyTeam</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
        background-color: #06140d;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .card {
        background-color: #0c2016;
        border: 1px solid #163827;
        border-radius: 20px;
        padding: 40px;
        max-width: 450px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
        color: #00ff66;
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 10px;
        text-align: center;
    }

    .subtitle {
        color: #8fa89b;
        font-size: 0.9rem;
        margin-bottom: 30px;
        text-align: center;
        line-height: 1.4;
    }

    .opcoes {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .opcao {
        width: 100%;
        background-color: #122c1e;
        border: 1px solid #1d4630;
        color: #ffffff;
        padding: 20px;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
    }

    .opcao:hover {
        border-color: #00ff66;
        background-color: #163824;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,255,102,0.12);
    }

    .icone {
        font-size: 2rem;
        margin-bottom: 8px;
    }

    .titulo {
        color: #00ff66;
        font-size: 1rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }

    .descricao {
        color: #8fa89b;
        font-size: 0.85rem;
    }
</style>

</head> <body>
<div class="card">

    <h1>SpyTeam</h1>

    <p class="subtitle">
        Selecione como deseja acessar o sistema.
    </p>

    <div class="opcoes">

        <button class="opcao" onclick="entrarProfessor()">
            <div class="icone">👨‍🏫</div>

            <div class="titulo">
                Professor
            </div>

            <div class="descricao">
                Gerencie alunos, treinos e agendamentos.
            </div>
        </button>

        <button class="opcao" onclick="entrarAluno()">
            <div class="icone">🏃</div>

            <div class="titulo">
                Aluno
            </div>

            <div class="descricao">
                Consulte seus treinos e acompanhe seu desempenho.
            </div>
        </button>

    </div>

</div>

<script>

    function entrarProfessor() {
        window.location.href = '/home';
    }

    function entrarAluno() {
        window.location.href = '/aluno';
    }

</script>

</body> </html>
