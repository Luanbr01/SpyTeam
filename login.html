<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Assessoria Esportiva</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #06140d; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background-color: #0c2016; border: 1px solid #163827; border-radius: 20px; padding: 40px; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #00ff66; font-size: 2rem; font-weight: 800; margin-bottom: 10px; text-align: center; }
        p.subtitle { color: #8fa89b; font-size: 0.9rem; margin-bottom: 30px; text-align: center; line-height: 1.4; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #00ff66; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input { width: 100%; background-color: #122c1e; border: 1px solid #1d4630; color: #ffffff; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #00ff66; }
        button { width: 100%; background-color: #00ff66; color: #06140d; border: none; padding: 14px; border-radius: 50px; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; cursor: pointer; margin-top: 10px; transition: all 0.2s ease; }
        button:hover { background-color: #00cc52; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,255,102,0.2); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Acesso ao Painel</h1>
        <p class="subtitle">Informe suas credenciais para gerenciar a assessoria.</p>

        <form id="formLogin">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            // Redireciona diretamente para a página principal (/home)
            window.location.href = '/home';
        });
    </script>
</body>
</html>
