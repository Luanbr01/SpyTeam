<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Treino Base</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #06140d; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background-color: #0c2016; border: 1px solid #163827; border-radius: 20px; padding: 40px; max-width: 460px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .back-link { display: inline-block; color: #00ff66; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-bottom: 20px; }
        .back-link:hover { text-decoration: underline; }
        h2 { color: #00ff66; font-size: 1.8rem; font-weight: 800; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #00ff66; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input, select, textarea { width: 100%; background-color: #122c1e; border: 1px solid #1d4630; color: #ffffff; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus { border-color: #00ff66; }
        select option { background-color: #122c1e; color: #ffffff; }
        button { width: 100%; background-color: #00ff66; color: #06140d; border: none; padding: 14px; border-radius: 50px; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; cursor: pointer; margin-top: 10px; transition: all 0.2s ease; }
        button:hover { background-color: #00cc52; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,255,102,0.2); }
        #mensagem { margin-top: 15px; text-align: center; font-weight: 600; color: #00ff66; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/home" class="back-link">← Voltar ao Menu</a>
        <h2>Cadastrar Treino Base</h2>

        <form id="formTreinoBase">
            <div class="form-group">
                <label for="titulo">Título do Treino</label>
                <input type="text" id="titulo" placeholder="Ex: Tiro 10x400m" required>
            </div>

            <div class="form-group">
                <label for="modalidade">Modalidade</label>
                <select id="modalidade" required>
                    <option value="Corrida">Corrida</option>
                    <option value="Natação">Natação</option>
                    <option value="Ciclismo">Ciclismo</option>
                    <option value="Fortalecimento">Fortalecimento</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" placeholder="Detalhes da execução do treino" required></textarea>
            </div>

            <div class="form-group">
                <label for="ritmo_alvo">Ritmo Alvo (Pace/Zona)</label>
                <input type="text" id="ritmo_alvo" placeholder="Ex: 4:30 min/km (Opcional)">
            </div>

            <button type="submit">Cadastrar Treino</button>
        </form>

        <div id="mensagem"></div>
    </div>

    <script>
        document.getElementById('formTreinoBase').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const titulo = document.getElementById('titulo').value;
            const modalidade = document.getElementById('modalidade').value;
            const descricao = document.getElementById('descricao').value;
            const ritmo_alvo = document.getElementById('ritmo_alvo').value || null;

            const res = await fetch('/api/treinos-base', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo, modalidade, descricao, ritmo_alvo })
            });

            if (res.ok) {
                document.getElementById('mensagem').innerText = "Treino base cadastrado com sucesso!";
                document.getElementById('formTreinoBase').reset();
            } else {
                document.getElementById('mensagem').innerText = "Erro ao cadastrar treino base.";
            }
        });
    </script>
</body>
</html>
