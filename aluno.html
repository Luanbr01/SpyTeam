<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Painel do Aluno - SpyTeam
    </title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family:
                'Segoe UI',
                Roboto,
                sans-serif;
        }

        body {

            background: #06140d;

            color: #fff;

            min-height: 100vh;

            padding: 30px;
        }

        .container {

            max-width: 1050px;

            margin: 0 auto;
        }

        .topo {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }

        .topo h1 {

            color: #00ff66;

            font-size: 2rem;
        }

        .topo p {

            color: #8fa89b;

            margin-top: 5px;
        }

        .btn {

            background: #122c1e;

            color: #fff;

            border:
                1px solid
                #1d4630;

            padding:
                10px 18px;

            border-radius: 10px;

            cursor: pointer;
        }

        .btn:hover {

            border-color: #00ff66;
        }

        .resumo {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px,1fr)
                );

            gap: 15px;

            margin-bottom: 25px;
        }

        .mini {

            background: #0c2016;

            border:
                1px solid
                #163827;

            border-radius: 16px;

            padding: 20px;
        }

        .mini h2 {

            color: #00ff66;

            font-size: 1.7rem;
        }

        .mini p {

            color: #8fa89b;

            margin-top: 5px;
        }

        .section {

            background: #0c2016;

            border:
                1px solid
                #163827;

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 20px;
        }

        .section h2 {

            color: #00ff66;

            margin-bottom: 15px;
        }

        .treino {

            background: #122c1e;

            border:
                1px solid
                #1d4630;

            border-radius: 14px;

            padding: 18px;

            margin-top: 12px;
        }

        .treino-header {

            display: flex;

            justify-content:
                space-between;

            gap: 15px;

            align-items:
                flex-start;
        }

        .treino h3 {

            color: #fff;

            margin-bottom: 6px;
        }

        .badge {

            color: #06140d;

            background: #00ff66;

            padding:
                5px 9px;

            border-radius: 20px;

            font-size: .75rem;

            font-weight: 800;

            white-space: nowrap;
        }

        .treino p {

            color: #b4c5bb;

            line-height: 1.5;

            margin-top: 8px;
        }

        .acao {

            margin-top: 14px;
        }

        .acao button {

            background: #00ff66;

            color: #06140d;

            border: none;

            padding:
                10px 14px;

            border-radius: 10px;

            font-weight: 800;

            cursor: pointer;
        }

        .acao button:disabled {

            opacity: .55;

            cursor: not-allowed;
        }

        .vazio {

            color: #8fa89b;
        }

        @media(max-width:650px) {

            .topo {

                flex-direction: column;

                align-items:
                    flex-start;
            }

            .treino-header {

                flex-direction:
                    column;
            }

        }

    </style>

</head>

<body>

<div class="container">


    <!-- ====================================================
         CABEÇALHO
         ==================================================== -->

    <div class="topo">

        <div>

            <h1 id="titulo">
                Painel do Aluno
            </h1>

            <p id="subtitulo">
                Carregando seus dados...
            </p>

        </div>


        <button
            class="btn"
            onclick="sair()"
        >
            Sair
        </button>

    </div>


    <!-- ====================================================
         RESUMO
         ==================================================== -->

    <div class="resumo">


        <div class="mini">

            <h2 id="total">
                0
            </h2>

            <p>
                Treinos agendados
            </p>

        </div>


        <div class="mini">

            <h2 id="pendentes">
                0
            </h2>

            <p>
                Treinos pendentes
            </p>

        </div>


        <div class="mini">

            <h2 id="concluidos">
                0
            </h2>

            <p>
                Treinos concluídos
            </p>

        </div>


    </div>


    <!-- ====================================================
         TREINOS PENDENTES
         ==================================================== -->

    <div class="section">

        <h2>
            📅 Meus próximos treinos
        </h2>

        <div id="listaPendentes">

            <p class="vazio">
                Carregando...
            </p>

        </div>

    </div>


    <!-- ====================================================
         HISTÓRICO
         ==================================================== -->

    <div class="section">

        <h2>
            ✅ Histórico de treinos concluídos
        </h2>

        <div id="listaConcluidos">

            <p class="vazio">
                Carregando...
            </p>

        </div>

    </div>


    <!-- ====================================================
         PERFIL
         ==================================================== -->

    <div class="section">

        <h2>
            👤 Meu perfil
        </h2>

        <p
            id="perfil"
            class="vazio"
        >
            Carregando...
        </p>

    </div>


</div>


<script>


// ==========================================================
// VARIÁVEL DOS TREINOS
// ==========================================================

let treinos = [];


// ==========================================================
// PROTEGER HTML
// ==========================================================
//
// Evita que caracteres digitados pelo usuário
// sejam interpretados como HTML.
//

function escapeHtml(text) {

    return String(
        text ?? ''
    ).replace(
        /[&<>'"]/g,
        c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[c])
    );
}


// ==========================================================
// CRIAR CARD DE TREINO
// ==========================================================

function cardTreino(t) {

    const status =
        t.concluido
        ? 'Concluído'
        : 'Pendente';


    const botao =
        t.concluido

        ?

        '<button disabled>' +
        'Treino concluído' +
        '</button>'

        :

        `<button
            onclick="concluirTreino(${t.id})"
        >
            Marcar como concluído
        </button>`;


    return `

        <div class="treino">

            <div class="treino-header">

                <div>

                    <h3>
                        ${escapeHtml(
                            t.treino.titulo
                        )}
                    </h3>

                    <strong>
                        ${escapeHtml(
                            t.treino.modalidade
                        )}
                    </strong>

                </div>

                <span class="badge">

                    ${status}

                </span>

            </div>


            <p>

                <b>Data:</b>

                ${escapeHtml(
                    t.data_planejada
                )}

            </p>


            <p>

                ${escapeHtml(
                    t.treino.descricao
                )}

            </p>


            ${
                t.treino.ritmo_alvo

                ?

                `<p>
                    <b>Ritmo alvo:</b>
                    ${escapeHtml(
                        t.treino.ritmo_alvo
                    )}
                </p>`

                :

                ''
            }


            <div class="acao">

                ${botao}

            </div>

        </div>

    `;
}


// ==========================================================
// CARREGAR DADOS
// ==========================================================

async function carregar() {

    // Busca informações do usuário
    const resMe =
        await fetch(
            '/api/me'
        );


    // Busca os treinos
    const resTreinos =
        await fetch(
            '/api/me/treinos'
        );


    // Se não estiver autenticado
    if (
        resMe.status === 401
        ||
        resTreinos.status === 401
    ) {

        window.location.href =
            '/login';

        return;
    }


    // Algum erro
    if (
        !resMe.ok
        ||
        !resTreinos.ok
    ) {

        document
            .getElementById(
                'subtitulo'
            )
            .textContent =
                'Erro ao carregar seus dados.';

        return;
    }


    // Converte respostas
    const me =
        await resMe.json();


    treinos =
        await resTreinos.json();


    // Nome do aluno
    document
        .getElementById(
            'subtitulo'
        )
        .textContent =

        `Bem-vindo, ` +
        `${me.aluno.nome}! ` +
        `Nível: ${me.aluno.nivel}`;


    // Perfil
    document
        .getElementById(
            'perfil'
        )
        .innerHTML =

        `Nome:
        <b>
            ${escapeHtml(
                me.aluno.nome
            )}
        </b>

        <br>

        Nível:
        <b>
            ${escapeHtml(
                me.aluno.nivel
            )}
        </b>

        <br>

        Usuário:
        <b>
            ${escapeHtml(
                me.usuario
            )}
        </b>`;


    // Atualiza tela
    atualizarTela();
}


// ==========================================================
// ATUALIZAR TELA
// ==========================================================

function atualizarTela() {

    // Treinos pendentes
    const pendentes =
        treinos.filter(
            t => !t.concluido
        );


    // Treinos concluídos
    const concluidos =
        treinos.filter(
            t => t.concluido
        );


    // Atualiza números
    document
        .getElementById(
            'total'
        )
        .textContent =
            treinos.length;


    document
        .getElementById(
            'pendentes'
        )
        .textContent =
            pendentes.length;


    document
        .getElementById(
            'concluidos'
        )
        .textContent =
            concluidos.length;


    // Mostra pendentes
    document
        .getElementById(
            'listaPendentes'
        )
        .innerHTML =

        pendentes.length

        ?

        pendentes
            .map(cardTreino)
            .join('')

        :

        '<p class="vazio">' +
        'Nenhum treino pendente.' +
        '</p>';


    // Mostra concluídos
    document
        .getElementById(
            'listaConcluidos'
        )
        .innerHTML =

        concluidos.length

        ?

        concluidos
            .map(cardTreino)
            .join('')

        :

        '<p class="vazio">' +
        'Nenhum treino concluído ainda.' +
        '</p>';
}


// ==========================================================
// CONCLUIR TREINO
// ==========================================================

async function concluirTreino(id) {

    // Faz requisição para API
    const resposta =
        await fetch(
            `/api/treinos/${id}/concluir`,
            {
                method: 'PATCH'
            }
        );


    // Se deu erro
    if (!resposta.ok) {

        const dados =
            await resposta
                .json()
                .catch(
                    () => ({})
                );


        alert(
            dados.detail
            ||
            'Não foi possível concluir o treino.'
        );

        return;
    }


    // Procura treino na lista
    const treino =
        treinos.find(
            t => t.id === id
        );


    // Marca como concluído
    if (treino) {

        treino.concluido = true;

    }


    // Atualiza tela
    atualizarTela();
}


// ==========================================================
// SAIR
// ==========================================================

async function sair() {

    await fetch(
        '/api/logout',
        {
            method: 'POST'
        }
    );


    window.location.href =
        '/login';
}


// ==========================================================
// INICIAR
// ==========================================================

carregar();

</script>

</body>

</html>
